input_data:
  cisTopic_obj_fname: "${EHT_DATA_DIR}/snATACseq/cisTopic/cistopic_obj.pkl"
  GEX_anndata_fname: "${EHT_DATA_DIR}/multiome/HPC_HE_seurat_RNAOnly.h5ad"
  region_set_folder: "${EHT_DATA_DIR}/snATACseq/cisTopic/region_sets"
  ctx_db_fname: "${EHT_DATA_DIR}/multiome/cistarget_motif_databases/Hematopoietic_scATAC.hg38.with_1kb_bg_with_mask.regions_vs_motifs.rankings.feather"
  dem_db_fname: "${EHT_DATA_DIR}/multiome/cistarget_motif_databases/Hematopoietic_scATAC.hg38.with_1kb_bg_with_mask.regions_vs_motifs.scores.feather"
  path_to_motif_annotations: "${EHT_RESOURCES}/aertslab_motif_colleciton/v10nr_clust_public/snapshots/motifs-v10-nr.hgnc-m0.00001-o0.0.tbl"

output_data:
  # output for prepare_GEX_ACC .h5mu
  combined_GEX_ACC_mudata: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/ACC_GEX.h5mu"
  # output for motif enrichment results .hdf5
  dem_result_fname: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/dem_results.hdf5"
  ctx_result_fname: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/ctx_results.hdf5"
  # output html for motif enrichment results .html
  output_fname_dem_html: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/dem_results.html"
  output_fname_ctx_html: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/ctx_results.html"
  # output for prepare_menr .h5ad
  cistromes_direct: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/cistromes_direct.h5ad"
  cistromes_extended: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/cistromes_extended.h5ad"
  # output tf names .txt
  tf_names: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/tf_names.txt"
  # output for download_genome_annotations .tsv
  genome_annotation: "${EHT_DATA_DIR}/multiome/scenicplus_outs/genome_annotation.tsv"
  chromsizes: "${EHT_DATA_DIR}/multiome/scenicplus_outs/chromsizes.tsv"
  # output for search_space .tsb
  search_space: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/search_space.tsv"
  # output tf_to_gene .tsv
  tf_to_gene_adjacencies: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/tf_to_gene_adj.tsv"
  # output region_to_gene .tsv
  region_to_gene_adjacencies: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/region_to_gene_adj.tsv"
  # output eGRN .tsv
  eRegulons_direct: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/eRegulon_direct.tsv"
  eRegulons_extended: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/eRegulons_extended.tsv"
  # output AUCell .h5mu
  AUCell_direct: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/AUCell_direct.h5mu"
  AUCell_extended: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/AUCell_extended.h5mu"
  # output scplus mudata .h5mu
  scplus_mdata: "${EHT_DATA_DIR}/multiome/scenicplus_outs500k/scplusmdata.h5mu"

params_general:
  temp_dir: "${TMPDIR}"
  n_cpu: 40
  seed: 666

params_data_preparation:
  # Params for prepare_GEX_ACC
  bc_transform_func: "\"lambda x: f'{x}'\""
  is_multiome: True
  key_to_group_by: ""
  nr_cells_per_metacells: 10
  # Params for prepare_menr
  direct_annotation: "Direct_annot"
  extended_annotation: "Orthology_annot"
  # Params for download_genome_annotations
  species: "hsapiens"
  biomart_host: "http://www.ensembl.org"
  # Params for search_space
  search_space_upstream: "10 500000"  # run of record: 500 kb
  search_space_downstream: "10 500000"  # run of record: 500 kb
  search_space_extend_tss: "10 10"

params_motif_enrichment:
  species: "homo_sapiens"
  annotation_version: "v10nr_clust"
  motif_similarity_fdr: 0.001
  orthologous_identity_threshold: 0.0
  annotations_to_use: "Direct_annot Orthology_annot"
  fraction_overlap_w_dem_database: 0.4
  dem_max_bg_regions: 500
  dem_balance_number_of_promoters: True
  dem_promoter_space: 1_000
  dem_adj_pval_thr: 0.05
  dem_log2fc_thr: 1.0
  dem_mean_fg_thr: 0.0
  dem_motif_hit_thr: 3.0
  fraction_overlap_w_ctx_database: 0.4
  ctx_auc_threshold: 0.005
  ctx_nes_threshold: 3.0
  ctx_rank_threshold: 0.05




params_inference:
  # Params for tf_to_gene
  tf_to_gene_importance_method: "GBM"
  # Params regions_to_gene
  region_to_gene_importance_method: "GBM"
  region_to_gene_correlation_method: "SR"
  # Params for eGRN inference
  order_regions_to_genes_by: "importance"
  order_TFs_to_genes_by: "importance"
  gsea_n_perm: 1000
  quantile_thresholds_region_to_gene: "0.85 0.90 0.95"
  top_n_regionTogenes_per_gene: "5 10 15"
  top_n_regionTogenes_per_region: ""
  min_regions_per_gene: 0
  rho_threshold: 0.05
  min_target_genes: 10

